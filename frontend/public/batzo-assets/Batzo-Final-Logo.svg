 <radialGradient id="ball"><stop stop-color="#ff4a4a"/><stop offset=".7" stop-color="#d40018"/><stop offset="1" stop-color="#78000c"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<g filter="url(#glow)" font-family="Arial Black,Arial,sans-serif" font-weight="900">
