<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300">
<defs>
 <linearGradient id="b" x1="0" x2="1"><stop stop-color="#20ff4b"/><stop offset="1" stop-color="#00aaff"/></linearGradient>
 <linearGradient id="a" x1="0" x2="1"><stop stop-color="#ffd21c"/><stop offset="1" stop-color="#ff6a00"/></linearGradient>
